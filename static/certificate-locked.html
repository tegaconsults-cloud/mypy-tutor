<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Certificate Locked — MyPy Tutor</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:Arial,sans-serif;background:#0f1117;color:#e2e8f0;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:20px;
  }
  .box{
    background:#1a202c;border:1px solid #2d3748;border-radius:16px;

  .plan{color:#63b3ed;font-weight:700}
  .divider{color:#4a5568;margin:4px 0;font-size:.85rem}
  .cta{
    display:inline-block;margin-top:8px;background:#3182ce;color:#fff;
    text-decoration:none;padding:12px 28px;border-radius:10px;
    font-weight:700;font-size:.95rem;transition:background .15s;

  .cta:hover{background:#2b6cb0}
  .back{display:block;margin-top:16px;font-size:.8rem;color:#4a5568}
  .back a{color:#63b3ed;text-decoration:none}
